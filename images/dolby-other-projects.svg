<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2b33"/>
      <stop offset="1" stop-color="#16224a"/>
    </linearGradient>
    <linearGradient id="sdrSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8597"/>
      <stop offset="1" stop-color="#a9a49a"/>
    </linearGradient>
    <linearGradient id="hdrSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3fd8"/>
      <stop offset="0.55" stop-color="#ff6fa0"/>
      <stop offset="1" stop-color="#ffc24b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel"><rect x="32" y="56" width="300" height="230" rx="16"/></clipPath>
    <clipPath id="left"><rect x="32" y="56" width="150" height="230"/></clipPath>
    <clipPath id="right"><rect x="182" y="56" width="150" height="230"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="600" cy="320" r="150" fill="#1c9fb8" opacity="0.12"/>
  <circle cx="40" cy="20" r="120" fill="#4353c9" opacity="0.15"/>

  <!-- HDR: same scene, SDR vs HDR -->
  <g clip-path="url(#panel)">
    <g clip-path="url(#left)">
      <rect x="32" y="56" width="300" height="230" fill="url(#sdrSky)"/>
      <circle cx="182" cy="150" r="26" fill="#d9d4c7"/>
      <path d="M32 286 L32 222 L102 168 L150 206 L212 150 L332 236 L332 286 Z" fill="#4b5160"/>
      <path d="M32 286 L32 250 L120 226 L220 248 L332 232 L332 286 Z" fill="#3a3f4b"/>
    </g>
    <g clip-path="url(#right)">
      <rect x="32" y="56" width="300" height="230" fill="url(#hdrSky)"/>
      <circle cx="182" cy="150" r="70" fill="url(#sun)"/>
      <circle cx="182" cy="150" r="22" fill="#ffffff"/>
      <path d="M32 286 L32 222 L102 168 L150 206 L212 150 L332 236 L332 286 Z" fill="#3b1d6e"/>
      <path d="M32 286 L32 250 L120 226 L220 248 L332 232 L332 286 Z" fill="#1d1240"/>
    </g>
    <line x1="182" y1="56" x2="182" y2="286" stroke="#ffffff" stroke-width="3"/>
  </g>
  <circle cx="182" cy="171" r="13" fill="#ffffff"/>
  <path d="M176 171 l-4 0 M188 171 l4 0" stroke="#16224a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M174 167 l-4 4 l4 4 M190 167 l4 4 l-4 4" fill="none" stroke="#16224a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="46" y="70" width="48" height="24" rx="12" fill="#000" opacity="0.35"/>
    <text x="70" y="87" text-anchor="middle" fill="#e6e8ee">SDR</text>
    <rect x="270" y="70" width="48" height="24" rx="12" fill="#ffffff"/>
    <text x="294" y="87" text-anchor="middle" fill="#16224a">HDR</text>
  </g>

  <!-- Active speaker detection on smart glasses -->
  <g transform="translate(372 56)">
    <rect width="236" height="230" rx="16" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>

    <!-- speakers -->
    <g transform="translate(40 44)">
      <circle cx="0" cy="0" r="16" fill="#8e9bff" opacity="0.55"/>
      <rect x="-20" y="18" width="40" height="34" rx="16" fill="#8e9bff" opacity="0.55"/>
    </g>
    <g transform="translate(118 36)">
      <rect x="-30" y="-26" width="60" height="86" rx="8" fill="none" stroke="#4fd1a5" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="17" fill="#4fd1a5"/>
      <rect x="-21" y="19" width="42" height="36" rx="16" fill="#4fd1a5"/>
      <rect x="-30" y="-44" width="60" height="18" rx="9" fill="#4fd1a5"/>
      <text x="0" y="-31" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0d2b33">SPEAKING</text>
      <path d="M26 -4 q8 8 0 16 M33 -10 q14 14 0 28" fill="none" stroke="#4fd1a5" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(196 44)">
      <circle cx="0" cy="0" r="16" fill="#8e9bff" opacity="0.55"/>
      <rect x="-20" y="18" width="40" height="34" rx="16" fill="#8e9bff" opacity="0.55"/>
    </g>

    <!-- smart glasses -->
    <g transform="translate(118 170)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-86" y="-20" width="68" height="44" rx="18"/>
      <rect x="18" y="-20" width="68" height="44" rx="18"/>
      <path d="M-18 -4 q18 -12 36 0"/>
      <path d="M-86 -10 l-14 -6 M86 -10 l14 -6"/>
    </g>
    <circle cx="70" cy="160" r="4" fill="#4fd1a5"/>
    <circle cx="166" cy="160" r="4" fill="#4fd1a5"/>
    <g fill="#4fd1a5" transform="translate(84 206)">
      <rect x="0" y="6" width="4" height="8" rx="2"/><rect x="8" y="2" width="4" height="16" rx="2"/><rect x="16" y="0" width="4" height="20" rx="2"/><rect x="24" y="4" width="4" height="12" rx="2"/><rect x="32" y="1" width="4" height="18" rx="2"/><rect x="40" y="5" width="4" height="10" rx="2"/><rect x="48" y="3" width="4" height="14" rx="2"/><rect x="56" y="7" width="4" height="6" rx="2"/><rect x="64" y="5" width="4" height="10" rx="2"/>
    </g>
  </g>
</svg>
