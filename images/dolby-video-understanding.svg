<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7cf0"/>
      <stop offset="1" stop-color="#b58cf5"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08ab4"/>
      <stop offset="1" stop-color="#f7c58b"/>
    </linearGradient>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6c9"/>
      <stop offset="1" stop-color="#7fd8b8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="f"><rect width="84" height="60" rx="8"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="560" cy="40" r="140" fill="#8a5cf6" opacity="0.12"/>
  <circle cx="60" cy="330" r="120" fill="#4353c9" opacity="0.18"/>

  <!-- highlighted moment -->
  <rect x="220" y="44" width="200" height="228" rx="14" fill="url(#glow)"/>
  <rect x="220" y="44" width="200" height="228" rx="14" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="268" y="26" width="104" height="26" rx="13" fill="#ffd166"/>
  <text x="320" y="44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2d1b4e">MOMENT</text>

  <!-- film strip: six frames -->
  <g transform="translate(38 76)">
    <g>
      <g clip-path="url(#f)"><rect width="84" height="60" fill="url(#sky1)"/><path d="M0 60 L22 34 L38 46 L58 26 L84 52 L84 60 Z" fill="#2b2f6b"/></g>
    </g>
    <g transform="translate(96 0)">
      <g clip-path="url(#f)"><rect width="84" height="60" fill="url(#sky1)"/><path d="M0 60 L22 34 L38 46 L58 26 L84 52 L84 60 Z" fill="#2b2f6b"/><circle cx="60" cy="40" r="6" fill="#fff"/><rect x="55" y="46" width="10" height="14" rx="4" fill="#fff"/></g>
    </g>
    <g transform="translate(192 0)">
      <g clip-path="url(#f)"><rect width="84" height="60" fill="url(#sky2)"/><circle cx="30" cy="30" r="8" fill="#fff"/><rect x="23" y="38" width="14" height="22" rx="6" fill="#fff"/><circle cx="58" cy="32" r="7" fill="#2d1b4e"/><rect x="52" y="39" width="12" height="21" rx="5" fill="#2d1b4e"/></g>
      <rect x="18" y="18" width="24" height="44" rx="4" fill="none" stroke="#ffd166" stroke-width="2"/>
    </g>
    <g transform="translate(288 0)">
      <g clip-path="url(#f)"><rect width="84" height="60" fill="url(#sky2)"/><circle cx="34" cy="30" r="8" fill="#fff"/><rect x="27" y="38" width="14" height="22" rx="6" fill="#fff"/><circle cx="56" cy="30" r="7" fill="#2d1b4e"/><rect x="50" y="37" width="12" height="23" rx="5" fill="#2d1b4e"/></g>
      <rect x="22" y="18" width="24" height="44" rx="4" fill="none" stroke="#ffd166" stroke-width="2"/>
    </g>
    <g transform="translate(384 0)">
      <g clip-path="url(#f)"><rect width="84" height="60" fill="url(#sky3)"/><rect x="10" y="34" width="20" height="26" fill="#1f5f6b"/><rect x="34" y="24" width="18" height="36" fill="#1f5f6b"/><rect x="56" y="38" width="22" height="22" fill="#1f5f6b"/></g>
    </g>
    <g transform="translate(480 0)">
      <g clip-path="url(#f)"><rect width="84" height="60" fill="url(#sky3)"/><rect x="4" y="30" width="22" height="30" fill="#1f5f6b"/><rect x="30" y="38" width="20" height="22" fill="#1f5f6b"/><rect x="54" y="22" width="24" height="38" fill="#1f5f6b"/></g>
    </g>
  </g>

  <!-- scene graph links over the moment -->
  <g stroke="#c9d0ff" stroke-width="1.5" opacity="0.8">
    <line x1="262" y1="168" x2="320" y2="190"/>
    <line x1="320" y1="190" x2="378" y2="168"/>
  </g>
  <g fill="#c9d0ff">
    <circle cx="262" cy="168" r="6"/>
    <circle cx="320" cy="190" r="6" fill="#ffd166"/>
    <circle cx="378" cy="168" r="6"/>
  </g>

  <!-- audio waveform -->
  <g fill="#4fd1c5" transform="translate(20 222)">
    <rect x="0" y="12" width="5" height="12" rx="2.5"/><rect x="10" y="8" width="5" height="20" rx="2.5"/><rect x="20" y="14" width="5" height="8" rx="2.5"/><rect x="30" y="10" width="5" height="16" rx="2.5"/><rect x="40" y="14" width="5" height="8" rx="2.5"/><rect x="50" y="12" width="5" height="12" rx="2.5"/><rect x="60" y="15" width="5" height="6" rx="2.5"/><rect x="70" y="11" width="5" height="14" rx="2.5"/><rect x="80" y="14" width="5" height="8" rx="2.5"/><rect x="90" y="9" width="5" height="18" rx="2.5"/><rect x="100" y="13" width="5" height="10" rx="2.5"/><rect x="110" y="15" width="5" height="6" rx="2.5"/><rect x="120" y="12" width="5" height="12" rx="2.5"/><rect x="130" y="14" width="5" height="8" rx="2.5"/><rect x="140" y="10" width="5" height="16" rx="2.5"/><rect x="150" y="14" width="5" height="8" rx="2.5"/><rect x="160" y="12" width="5" height="12" rx="2.5"/><rect x="170" y="15" width="5" height="6" rx="2.5"/><rect x="180" y="13" width="5" height="10" rx="2.5"/><rect x="190" y="14" width="5" height="8" rx="2.5"/>
    <g fill="#ffd166"><rect x="210" y="4" width="5" height="28" rx="2.5"/><rect x="220" y="0" width="5" height="36" rx="2.5"/><rect x="230" y="6" width="5" height="24" rx="2.5"/><rect x="240" y="2" width="5" height="32" rx="2.5"/><rect x="250" y="8" width="5" height="20" rx="2.5"/><rect x="260" y="1" width="5" height="34" rx="2.5"/><rect x="270" y="5" width="5" height="26" rx="2.5"/><rect x="280" y="0" width="5" height="36" rx="2.5"/><rect x="290" y="7" width="5" height="22" rx="2.5"/><rect x="300" y="3" width="5" height="30" rx="2.5"/><rect x="310" y="6" width="5" height="24" rx="2.5"/><rect x="320" y="2" width="5" height="32" rx="2.5"/><rect x="330" y="8" width="5" height="20" rx="2.5"/><rect x="340" y="4" width="5" height="28" rx="2.5"/><rect x="350" y="9" width="5" height="18" rx="2.5"/><rect x="360" y="5" width="5" height="26" rx="2.5"/><rect x="370" y="10" width="5" height="16" rx="2.5"/><rect x="380" y="6" width="5" height="24" rx="2.5"/><rect x="390" y="11" width="5" height="14" rx="2.5"/></g>
    <rect x="410" y="13" width="5" height="10" rx="2.5"/><rect x="420" y="15" width="5" height="6" rx="2.5"/><rect x="430" y="12" width="5" height="12" rx="2.5"/><rect x="440" y="14" width="5" height="8" rx="2.5"/><rect x="450" y="11" width="5" height="14" rx="2.5"/><rect x="460" y="15" width="5" height="6" rx="2.5"/><rect x="470" y="13" width="5" height="10" rx="2.5"/><rect x="480" y="14" width="5" height="8" rx="2.5"/><rect x="490" y="12" width="5" height="12" rx="2.5"/><rect x="500" y="15" width="5" height="6" rx="2.5"/><rect x="510" y="13" width="5" height="10" rx="2.5"/><rect x="520" y="14" width="5" height="8" rx="2.5"/><rect x="530" y="12" width="5" height="12" rx="2.5"/><rect x="540" y="15" width="5" height="6" rx="2.5"/><rect x="550" y="13" width="5" height="10" rx="2.5"/>
  </g>

  <!-- language query -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="150" y="296" width="340" height="40" rx="20" fill="#ffffff" opacity="0.95"/>
    <circle cx="174" cy="316" r="9" fill="none" stroke="#4353c9" stroke-width="2.5"/>
    <line x1="181" y1="323" x2="187" y2="329" stroke="#4353c9" stroke-width="2.5" stroke-linecap="round"/>
    <text x="198" y="321" fill="#2d1b4e">“When do they start talking?”</text>
  </g>
</svg>
